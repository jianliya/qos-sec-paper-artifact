[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qos-sec-paper-artifact"
version = "1.0.0"
description = "Reproducibility artifact for scheduler-boundary observability experiments in shared quantum clouds"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Liya Jian" },
  { name = "Yuqing Lan" },
]
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.4.3",
  "qiskit==2.3.1",
  "scipy==1.17.1",
]

[project.optional-dependencies]
hardware = [
  "qiskit-ibm-runtime==0.45.1",
]

[project.scripts]
qos-sec = "cli.run_experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
